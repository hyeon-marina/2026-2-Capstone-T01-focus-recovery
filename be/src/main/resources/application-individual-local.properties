# Same approval artifact, independent DB release and build/session gates as real-collection.
# No AI process or synthetic policy/account is provisioned by this profile.
spring.config.import=configtree:${COLLECTION_SECRETS_DIR}/
spring.datasource.url=jdbc:mysql://127.0.0.1:${COLLECTION_DB_PORT:33101}/focus_collection?serverTimezone=UTC
spring.datasource.username=focus_collection
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
server.address=127.0.0.1
server.port=${COLLECTION_TLS_PORT:9443}
server.ssl.enabled=true
server.ssl.key-store=file:${COLLECTION_TLS_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.forward-headers-strategy=none
server.tomcat.accesslog.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
focus-recovery.v2.storage.enabled=true
focus-recovery.v2.dispatch.enabled=false
focus-recovery.collection.administration-enabled=true
focus-recovery.collection.site-policy-file=${COLLECTION_SITE_POLICY_FILE}
logging.level.org.hibernate.SQL=OFF
