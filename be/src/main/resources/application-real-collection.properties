# Still fails closed without APPROVED artifact + active DB release + current consent + build/session scope.
spring.config.import=configtree:/run/collection-secrets/
spring.datasource.url=jdbc:mysql://mysql:3306/focus_collection?serverTimezone=UTC
spring.datasource.username=focus_collection
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
server.port=9443
server.ssl.enabled=true
server.ssl.key-store=file:/run/tls/backend.p12
server.ssl.key-store-type=PKCS12
server.forward-headers-strategy=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
focus-recovery.v2.storage.enabled=true
focus-recovery.v2.dispatch.enabled=true
focus-recovery.collection.administration-enabled=true
focus-recovery.collection.site-policy-file=/run/policy/site-policy.json
focus-recovery.ai.base-url=http://ai:8000
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=INFO
server.tomcat.accesslog.enabled=false
