# Preparation only. This profile cannot satisfy the exact-test storage gate.
spring.datasource.url=${COLLECTION_DB_URL}
spring.datasource.username=${COLLECTION_DB_USERNAME}
spring.datasource.password=${COLLECTION_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
server.address=${COLLECTION_BIND_ADDRESS:127.0.0.1}
server.port=${COLLECTION_TLS_PORT:9443}
server.ssl.enabled=true
server.ssl.key-store=${COLLECTION_TLS_KEYSTORE}
server.ssl.key-store-password=${COLLECTION_TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.forward-headers-strategy=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
focus-recovery.v2.storage.enabled=false
focus-recovery.v2.dispatch.enabled=false
focus-recovery.collection.administration-enabled=${COLLECTION_ADMINISTRATION_ENABLED:false}
