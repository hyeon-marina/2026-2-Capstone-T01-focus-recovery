spring.application.name=focus-recovery
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 전역 예외 응답을 모든 API에 붙이지 않고 각 API에 선언한 응답만 문서화한다
springdoc.override-with-generic-response=false
# AI Service 연동(AI-API-01). 아래 값은 모두 잠정값이며 AI 담당자와 확정 전이다
focus-recovery.ai.base-url=${AI_BASE_URL:http://localhost:8000}
focus-recovery.ai.connect-timeout=2s
focus-recovery.ai.response-timeout=10s
focus-recovery.ai.probability-sum-tolerance=0.001
# 분석 전용 실행기: AI 동시 호출 수와 대기 큐. 큐가 차면 해당 분석을 ANALYSIS_QUEUE_FULL로 실패 기록한다
focus-recovery.analysis.executor.pool-size=4
focus-recovery.analysis.executor.queue-capacity=100
# 미완료 분석 복구(AI 재호출 없음): PENDING은 requested_at, RUNNING은 started_at 기준(started_at이 없는 V5 이전 RUNNING은 requested_at + pending-timeout + running-timeout).
# 시작 시 running-timeout > response-timeout, pending-timeout > (queue / pool + 1) × response-timeout(기본 260s)을 검사한다
focus-recovery.analysis.recovery.interval=1m
focus-recovery.analysis.recovery.pending-timeout=10m
focus-recovery.analysis.recovery.running-timeout=1m
# 알림 후보(잠정, 서버 전체 설정). AI 또는 FIXED_INTERVAL 중 하나만 활성화하며 세션별 방식 선택은 아직 지원하지 않는다.
# 실행 중 변경하지 않으며, 모드 전환은 진행 중인 세션을 모두 종료한 뒤 서버를 재시작하는 운영을 전제로 한다
focus-recovery.alert.mode=AI
# 마지막으로 실제 표시된 AI 알림의 shownAt부터 새 AI 후보까지의 최소 간격(잠정)
focus-recovery.alert.ai.min-interval=5m
# 고정 주기 간격(잠정 10분, 파일럿에서 조정): 예정 시각은 startedAt + 간격 × n(n ≥ 1)으로 고정하며 shownAt으로 다시 계산하지 않는다
focus-recovery.alert.fixed-interval.interval=10m
# AI 알림 후보 처리 작업 복구(후보 생성만 재시도, AI 재호출 없음). 30초마다 누락 등록·멈춘 작업 복구·대기 작업 처리.
# 오류 재시도: 최대 5회, 30s·1m·2m·4m 간격(최대 5m) → 첫 실패 후 약 7.5분 안에 끝나 짧은 DB 재시작·장애 조치는 넘기고
# 알림 시점이 지나치게 늦어지지 않게 한다. 처리 중 running-timeout(2m, InnoDB 잠금 대기 기본 50s보다 김)을 넘기면 멈춘 것으로 본다
focus-recovery.alert.task.interval=30s
focus-recovery.alert.task.max-attempts=5
focus-recovery.alert.task.initial-delay=30s
focus-recovery.alert.task.max-delay=5m
focus-recovery.alert.task.running-timeout=2m
# 클라이언트 시각(shownAt·selectedAt)과 서버 시각(후보 생성·세션 종료·현재 시각) 비교 허용 오차(잠정 5초, 최종 합의값 아님).
# 요청 도착 지연과는 무관하다. 종료 후 최대 5초 안의 표시는 허용 범위에 들어올 수 있다
focus-recovery.alert.clock-skew-tolerance=5s

# Issue #85: PROPOSED 비배포 저장 기반. true라도 활성 프로필이 정확히 test일 때만 동작한다.
focus-recovery.v2.storage.enabled=false

# Issue #89: 합성 test 프로필 전용. storage Gate와 별개로 dispatcher도 기본 비활성이다.
# AI lock wait 60s + soft inference 60s를 검토한 개발 한도이며 운영 승인/성능 보장이 아니다.
focus-recovery.v2.dispatch.enabled=false
focus-recovery.v2.dispatch.interval=1s
focus-recovery.v2.dispatch.response-timeout=130s
focus-recovery.v2.dispatch.lease=180s
focus-recovery.v2.dispatch.commit-margin=15s
focus-recovery.v2.dispatch.retry-backoff=1s
focus-recovery.v2.dispatch.workers=2

# No default service credential. Still requires the existing exact-test storage/dispatch gates.
focus-recovery.v2.dispatch.service-token=${AI_V2_SERVICE_TOKEN:}
