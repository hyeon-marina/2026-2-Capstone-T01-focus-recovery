plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.focusrecovery'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Test-only, loopback MySQL pilot. Never included in bootJar or production startup.
tasks.register('runCollectionPilot', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.focusrecovery.domain.collection.CollectionPilotServer'
}

// Record the built server revision, independently of the CLI checkout used for export.
springBoot {
    buildInfo {
        properties {
            additional = ['sourceCommit': providers.environmentVariable('COLLECTION_SOURCE_COMMIT').orElse(providers.provider {
                try {
                    def sha = providers.exec { commandLine 'git', 'rev-parse', 'HEAD'; ignoreExitValue = true }.standardOutput.asText.get().trim()
                    return sha ?: 'NOT_RECORDED'
                } catch (Exception ignored) { return 'NOT_RECORDED' }
            }).get()]
        }
    }
}

// Explicit isolated synthetic environment only, excluded from bootJar.
tasks.register('runIndividualLocalSynthetic', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.focusrecovery.domain.collection.IndividualLocalSyntheticServer'
}

tasks.register('writeCollectionTestClasspath') {
    dependsOn testClasses
    doLast {
        layout.buildDirectory.file('collection-test-classpath.txt').get().asFile.text = sourceSets.test.runtimeClasspath.asPath
    }
}
